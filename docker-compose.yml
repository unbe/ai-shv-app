services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: swiss-free-flight:latest
    container_name: swiss-free-flight
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/meteo/foehn"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
